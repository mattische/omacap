[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "omacap"
version = "0.8.1"
description = "Record whatever your computer is playing, straight to an audio file."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mattische" }]
keywords = [
  "audio", "recording", "pipewire", "pulseaudio", "tui", "loopback",
  "chords", "chord-detection", "key-detection", "tempo", "music",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = []

[project.optional-dependencies]
# Musical analysis (key, tempo, metre, chords). Only numpy: the DSP is written
# against it directly so a chord chart does not cost a scientific stack.
analyze = ["numpy>=1.22"]
dev = ["pytest>=7", "numpy>=1.22"]

[project.scripts]
omacap = "omacap.cli:main"

[project.urls]
Homepage = "https://github.com/mattische/omacap"
Issues = "https://github.com/mattische/omacap/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Lets the tests import their shared synth helper directly.
pythonpath = ["tests"]
