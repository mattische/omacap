[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "omacap"
version = "0.1.0"
description = "Record whatever your computer is playing, straight to an audio file."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mattische" }]
keywords = ["audio", "recording", "pipewire", "pulseaudio", "tui", "loopback"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
omacap = "omacap.cli:main"

[project.urls]
Homepage = "https://github.com/mattische/omacap"
Issues = "https://github.com/mattische/omacap/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
